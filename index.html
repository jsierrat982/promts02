<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bóveda de Prompts</title>
<meta name="description" content="Archivo personal de prompts de IA, organizado por categorías.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2317212E'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23C98A2C' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>
  (function () {
    var saved = localStorage.getItem("promptVaultTheme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>

<div class="app">

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir índice de categorías" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="brand">Bóveda<span class="brand-dot">.</span></h1>
      <p class="brand-sub">Archivo personal de prompts</p>
    </div>

    <nav class="index-nav" aria-label="Categorías">
      <p class="index-label">Índice</p>
      <ul id="categoryList" class="category-list"></ul>
      <button id="newCategoryBtn" class="btn-ghost btn-new-category" type="button">+ Nueva categoría</button>
    </nav>

    <div class="sidebar-footer">
      <p class="index-label">Copia de seguridad</p>
      <button id="exportBtn" class="btn-ghost" type="button">Exportar JSON</button>
      <button id="importBtn" class="btn-ghost" type="button">Importar JSON</button>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.4"/>
          <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Buscar por título, texto o etiqueta…" aria-label="Buscar prompts">
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar a modo oscuro" aria-pressed="false">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="3.6" stroke="currentColor" stroke-width="1.4"/>
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <line x1="9" y1="0.8" x2="9" y2="2.6"/>
              <line x1="9" y1="15.4" x2="9" y2="17.2"/>
              <line x1="0.8" y1="9" x2="2.6" y2="9"/>
              <line x1="15.4" y1="9" x2="17.2" y2="9"/>
              <line x1="3.3" y1="3.3" x2="4.6" y2="4.6"/>
              <line x1="13.4" y1="13.4" x2="14.7" y2="14.7"/>
              <line x1="13.4" y1="4.6" x2="14.7" y2="3.3"/>
              <line x1="3.3" y1="14.7" x2="4.6" y2="13.4"/>
            </g>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M15.5 10.8A6.6 6.6 0 1 1 7.2 2.5a5.2 5.2 0 0 0 8.3 8.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="addPromptBtn" class="btn-primary" type="button">+ Nuevo prompt</button>
      </div>
    </header>

    <div class="results-meta">
      <h2 id="activeCategoryTitle">Todos los prompts</h2>
      <span id="resultsCount" class="results-count">0 resultados</span>
    </div>

    <section id="promptGrid" class="prompt-grid" aria-live="polite"></section>

    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-title">Aquí no hay nada todavía.</p>
      <p class="empty-sub">Usa <strong>+ Nuevo prompt</strong> para archivar el primero de esta vista.</p>
    </div>
  </main>
</div>

<dialog id="promptModal" class="modal" aria-labelledby="modalTitle">
  <form id="promptForm" class="modal-form">
    <h3 id="modalTitle">Nuevo prompt</h3>

    <label class="field">
      <span>Título</span>
      <input type="text" id="fieldTitle" required maxlength="120" placeholder="Ej. Refactor de función Python">
    </label>

    <label class="field">
      <span>Texto del prompt</span>
      <textarea id="fieldText" required rows="7" placeholder="Escribe aquí el texto completo del prompt…"></textarea>
    </label>

    <div class="field-row">
      <label class="field">
        <span>Categoría</span>
        <select id="fieldCategory"></select>
      </label>
      <label class="field" id="newCategoryField" hidden>
        <span>Nombre de categoría</span>
        <input type="text" id="fieldNewCategory" maxlength="40" placeholder="Ej. Automatización">
      </label>
    </div>

    <label class="field">
      <span>Etiquetas <em>(separadas por coma, opcional)</em></span>
      <input type="text" id="fieldTags" placeholder="python, debugging, refactor">
    </label>

    <input type="hidden" id="fieldId">

    <div class="modal-actions">
      <button type="button" id="deleteFromModalBtn" class="btn-alert" hidden>Eliminar</button>
      <div class="modal-actions-right">
        <button type="button" id="cancelBtn" class="btn-ghost">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar prompt</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="viewModal" class="modal view-modal" aria-labelledby="viewModalTitle">
  <div class="modal-form">
    <div class="view-header">
      <h3 id="viewModalTitle"></h3>
      <span id="viewModalCategory" class="card-category"></span>
    </div>
    <div id="viewModalTags" class="card-tags"></div>
    <p id="viewModalText" class="view-text"></p>
    <div class="modal-actions">
      <span id="viewModalDate" class="card-date"></span>
      <div class="modal-actions-right">
        <button type="button" id="viewCopyBtn" class="btn-ghost">Copiar</button>
        <button type="button" id="viewEditBtn" class="btn-ghost">Editar</button>
        <button type="button" id="viewCloseBtn" class="btn-primary">Cerrar</button>
      </div>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
